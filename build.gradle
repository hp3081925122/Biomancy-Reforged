plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { mavenCentral() }
        filter { includeGroup 'com.h2database' }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '.cache/'
            exclude '.wiki_data/'
            exclude '.wiki_content/'
        }
    }
    datagen {
        java {
            exclude 'com/github/elenterius/biomancy/datagen/models/**'
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

neoForge {
    version = project.neo_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    addModdingDependenciesTo sourceSets.datagen

    interfaceInjectionData {
        from(file('gradle/interface_injections/geckolib.json'))
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'geckolib.disable_examples', 'true'
            systemProperty 'biomancy.dev_mode', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'
            if (project.hasProperty('mctestHidden')) {
                systemProperty 'selfmcp.window', 'hidden'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            sourceSet = project.sourceSets.datagen
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('datagen')) {
                sourceSet(sourceSets.datagen)
            }
        }
    }
}

configurations {
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation "curse.maven:jei-238222:8771077"
    implementation "curse.maven:just-enough-characters-250702:8413185"
    implementation "curse.maven:jade-324717:8651070"

    api "org.jspecify:jspecify:${project.jspecify_version}"
    api "org.jetbrains:annotations:${project.jetbrains_annotations_version}"

    jarJar(implementation("com.h2database:h2")) {
        version {
            strictly project.h2_version_range
            prefer project.h2_version
        }
    }

    implementation "maven.modrinth:8BmcQJ2H:${project.geckolib_file_id}"

    compileOnly "curse.maven:kubejs-238086:${project.kubejs_file_id}"
    compileOnly "curse.maven:rhino-416294:${project.rhino_file_id}"

    runtimeOnly "maven.modrinth:appleskin:${project.appleskin_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_credits: project.mod_credits,
            mod_description: project.mod_description,
            mod_url: project.mod_url,
            geckolib_version: project.geckolib_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest.attributes([
            'Specification-Title'     : project.mod_name,
            'Specification-Vendor'    : project.mod_vendor,
            'Specification-Version'   : project.mod_version,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.mod_version,
            'Implementation-Vendor'   : project.mod_vendor
    ])
    from(['CREDITS.md', 'LICENSE.txt', '3RD_PARTY_LICENSE.txt'])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '9000'
}
